services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1/chat/completions}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - DB_PATH=/data/data.db
    volumes:
      - db-data:/data
    restart: unless-stopped

volumes:
  db-data: